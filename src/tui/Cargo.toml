[package]
name = "daedalus-tui"
version = "0.2.0-beta.8"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Daedalus terminal control interface"

[dependencies]
ratatui = "=0.30.2"
crossterm = "0.29"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16.2"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "multipart"] }
yaml_serde = "0.10"
semver = "1"
base64 = "0.22"
portable-pty = "=0.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_System_Com"] }
