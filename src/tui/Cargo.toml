[package]
name = "daedalus-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Daedalus terminal control interface"

[dependencies]
ratatui = "=0.30.2"
crossterm = "0.29"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16.2"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "multipart"] }
yaml_serde = "0.10"
semver = "1"
