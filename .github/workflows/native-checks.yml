name: Native checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    # macOS also builds a second architecture for the universal package.
    timeout-minutes: ${{ matrix.os == 'macos-15' && 60 || 35 }}
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust tools
        shell: bash
        run: rustup update stable --no-self-update && rustup component add clippy rustfmt
      - name: Windows SDK resource compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-Command rc.exe -ErrorAction SilentlyContinue
          if (-not $compiler) {
            $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
            $compiler = Get-ChildItem "$sdk/*/x64/rc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $compiler) { throw 'Install the Windows SDK resource compiler before building.' }
            $compiler.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Pinned Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.12.zip'
          $downloaded = $false
          foreach ($url in @('https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip', 'https://distfiles.macports.org/nsis/nsis-3.12.zip')) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 30
              $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -ne '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f') { throw 'NSIS archive checksum mismatch' }
              $downloaded = $true
              break
            } catch {
              Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
              Write-Warning "No verified installer compiler archive from $url"
            }
          }
          if (-not $downloaded) { throw 'NSIS download failed' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'daedalus-nsis'
          Expand-Archive -LiteralPath $archive -DestinationPath $compilerRoot
          $compiler = Join-Path $compilerRoot 'nsis-3.12/Bin/makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'NSIS compiler is missing' }
          $compilerVersion = & $compiler /VERSION
          if ($LASTEXITCODE -ne 0 -or $compilerVersion -ne 'v3.12') { throw 'Unexpected NSIS compiler version' }
          "NSISDIR=$(Join-Path $compilerRoot 'nsis-3.12')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DAEDALUS_NSIS=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Linux checks
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/check.sh
      - name: macOS checks
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/check.sh
      - name: Windows checks including native ConPTY
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows.ps1
      - name: Linux executable and checksum
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="$(cat VERSION)"
          mkdir dist
          cp src/tui/target/release/daedalus-tui "dist/daedalus-$version-x86_64-linux"
          cd dist
          sha256sum "daedalus-$version-x86_64-linux" > "daedalus-$version-x86_64-linux.sha256"
      - name: Windows executable, installer and checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src/tui/target/release/daedalus-tui.exe "dist/daedalus-$version-x86_64-windows.exe"
          $nsis = $env:DAEDALUS_NSIS
          if (-not $nsis -or -not (Test-Path -LiteralPath $nsis -PathType Leaf)) { throw 'Verified NSIS compiler is unavailable' }
          $binaryPath = (Resolve-Path -LiteralPath "dist/daedalus-$version-x86_64-windows.exe").ProviderPath
          $iconPath = (Resolve-Path -LiteralPath assets/daedalus.ico).ProviderPath
          $scriptPath = (Resolve-Path -LiteralPath scripts/windows-installer.nsi).ProviderPath
          $outputPath = Join-Path (Resolve-Path -LiteralPath dist).ProviderPath "Daedalus-$version-setup.exe"
          & $nsis "/DPRODUCT_VERSION=$version" "/DBINARY=$binaryPath" "/DOUTPUT=$outputPath" "/DICON=$iconPath" $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          @(Get-ChildItem dist -File -Filter '*.exe') | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText($_.FullName + '.sha256', "$hash  $($_.Name)`n", [Text.UTF8Encoding]::new($false))
          }
      # Developer ID signing and notarization need maintainer secrets. They are
      # never exposed to pull requests from forks, which build ad-hoc packages.
      - name: macOS signing availability
        id: signing
        if: runner.os == 'macOS' && github.event_name == 'push'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        # Publishes only whether a certificate is configured, never its value.
        run: |
          if [[ -n "$MACOS_CERTIFICATE_P12" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: macOS signing keychain
        if: runner.os == 'macOS' && steps.signing.outputs.available == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/daedalus-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/daedalus-signing.p12"
          notary_key="$RUNNER_TEMP/daedalus-notary.p8"
          trap 'rm -f -- "$certificate" "$notary_key"' EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "DAEDALUS_MACOS_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "$MACOS_NOTARY_KEY" ]]; then
            printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$notary_key"
            xcrun notarytool store-credentials daedalus-notary --key "$notary_key" \
              --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" \
              --keychain "$keychain"
            echo "DAEDALUS_MACOS_NOTARY_PROFILE=daedalus-notary" >> "$GITHUB_ENV"
            echo "DAEDALUS_MACOS_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          fi
      - name: macOS universal DMG, update assets and checksums
        if: runner.os == 'macOS'
        shell: bash
        env:
          DAEDALUS_MACOS_UNIVERSAL: '1'
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ runner.os }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
